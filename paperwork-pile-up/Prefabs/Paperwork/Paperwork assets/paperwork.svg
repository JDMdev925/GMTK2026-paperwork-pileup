       transform="matrix(0.26458333,0,0,0.26458333,-5.8450185,0.73062731)"
       id="text11"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:24px;line-height:24.5669px;font-family:'Footlight MT Light';-inkscape-font-specification:'Footlight MT Light, ';letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect11);shape-padding:2.76143;display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:3.77953;stroke-linecap:round;stroke-miterlimit:4.6;stroke-dasharray:none;stroke-dashoffset:25.0961;stroke-opacity:1"><tspan
         x="393.50391"
         y="135.77925"
         id="tspan12">Termination of employee </tspan><tspan
         x="393.50391"
         y="160.34614"
         id="tspan30">#221045, Mr Jeremy Atlens. </tspan><tspan
         x="393.50391"
         y="184.91304"
         id="tspan31">Reasons for termination include: </tspan><tspan
         x="393.50391"
         y="209.47993"
         id="tspan32">poor hygiene standards, unreliable </tspan><tspan
         x="393.50391"
         y="234.04683"
         id="tspan33">attendance, repeated </tspan><tspan
         x="393.50391"
         y="258.61372"
         id="tspan34">misdemeaners resulting from not </tspan><tspan
         x="393.50391"
         y="283.18062"
         id="tspan35">following company policy, the </tspan><tspan
         x="393.50391"
         y="307.74751"
         id="tspan36">'butter incident' (see report 231-A </tspan><tspan
         x="393.50391"
         y="332.31441"
         id="tspan37">for details) and bringing </tspan><tspan
         x="393.50391"
         y="356.8813"
         id="tspan38">consumables containing peanuts to </tspan><tspan
         x="393.50391"
         y="381.4482"
         id="tspan39">the office despite</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(0.26458333,0,0,0.26458333,-2.4309501,-4.2199107)"
       id="text12"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:24px;line-height:24.5669px;font-family:'Footlight MT Light';-inkscape-font-specification:'Footlight MT Light, ';letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect12);shape-padding:1.38071;display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:3.77953;stroke-linecap:round;stroke-miterlimit:4.6;stroke-dasharray:none;stroke-dashoffset:25.0961;stroke-opacity:1"><tspan
         x="49.705078"
         y="428.49019"
         id="tspan40">repeated warnings not to, resulting in incident report 231-B.&#10;</tspan><tspan
         x="49.705078"
         y="453.05708"
         id="tspan41">&#10;</tspan><tspan
         x="49.705078"
         y="477.62398"
         id="tspan42">This document hereby outlines the official termination of an </tspan><tspan
         x="49.705078"
         y="502.19087"
         id="tspan43">employee from Longstead Accounting Ltd. under the condition 32(c), </tspan><tspan
         x="49.705078"
         y="526.75777"
         id="tspan44">which does not grant the employee severance or compensation for </tspan><tspan
         x="49.705078"
         y="551.32466"
         id="tspan45">this termination. Under consideration of the board of directors, the </tspan><tspan
         x="49.705078"
         y="575.89155"
         id="tspan46">employee has been granted the below offerings:&#10;</tspan><tspan
         x="49.705078"
         y="600.45845"
         id="tspan47">&#10;</tspan><tspan
         x="49.705078"
         y="625.02534"
         id="tspan48">          - 1x Jar of peanut butter&#10;</tspan><tspan
         x="49.705078"
         y="649.59224"
         id="tspan49">&#10;</tspan><tspan
         x="49.705078"
         y="674.15913"
         id="tspan50">On completion of this document, effective immediately, the </tspan><tspan
         x="49.705078"
         y="698.72603"
         id="tspan51">individual ceases employment at Lonstead Accounding Ltd. and all </tspan><tspan
         x="49.705078"
         y="723.29292"
         id="tspan52">affiliation between the company and the individual is nullified. The </tspan><tspan
         x="49.705078"
         y="747.85982"
         id="tspan53">board thanks Mr Atkins for his commitment to the company and </tspan><tspan
         x="49.705078"
         y="772.42671"
         id="tspan54">wishes him well on his future career.&#10;</tspan></text>
